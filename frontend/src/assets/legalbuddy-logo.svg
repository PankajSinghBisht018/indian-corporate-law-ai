<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Brand Orange Gradient -->
    <linearGradient id="lb-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9838" />
      <stop offset="45%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Warm Highlight Gradient -->
    <linearGradient id="lb-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- Subtle Fill with Transparency -->
    <linearGradient id="lb-subtle-fill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <!-- Outer Protective Shield (Transparent Background) -->
  <path 
    d="M 24 4 C 36 4, 43 11, 43 22 C 43 34.5, 24 44, 24 44 C 24 44, 5 34.5, 5 22 C 5 11, 12 4, 24 4 Z" 
    fill="url(#lb-subtle-fill)" 
    stroke="url(#lb-orange-grad)" 
    stroke-width="2.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Inner Protective Shield Accent Line -->
  <path 
    d="M 24 7.5 C 33.5 7.5, 39.5 13, 39.5 22 C 39.5 31.5, 24 39.5, 24 39.5 C 24 39.5, 8.5 31.5, 8.5 22 C 8.5 13, 14.5 7.5, 24 7.5 Z" 
    fill="none" 
    stroke="url(#lb-orange-grad)" 
    stroke-width="0.75" 
    stroke-opacity="0.4"
    stroke-dasharray="2 1.5"
  />

  <!-- Top Legal Beacon / AI Spark Diamond -->
  <polygon 
    points="24,9 26.8,12.8 24,16.5 21.2,12.8" 
    fill="url(#lb-highlight)" 
    stroke="url(#lb-orange-grad)"
    stroke-width="0.75"
  />

  <!-- Scales of Justice: Aerodynamic Balance Crossbeam -->
  <path 
    d="M 13 18 C 17.5 16.5, 30.5 16.5, 35 18" 
    stroke="url(#lb-orange-grad)" 
    stroke-width="2.2" 
    stroke-linecap="round" 
    fill="none"
  />

  <!-- Central Column (Pillar of Law) -->
  <line 
    x1="24" y1="16.5" x2="24" y2="34" 
    stroke="url(#lb-orange-grad)" 
    stroke-width="2.2" 
    stroke-linecap="round"
  />

  <!-- Left Scale: Strings & Pan -->
  <line x1="13" y1="18" x2="9.5" y2="25" stroke="url(#lb-orange-grad)" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />
  <line x1="13" y1="18" x2="16.5" y2="25" stroke="url(#lb-orange-grad)" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />
  <path 
    d="M 8 25 C 8 29.5, 18 29.5, 18 25 Z" 
    fill="url(#lb-orange-grad)"
  />

  <!-- Right Scale: Strings & Pan -->
  <line x1="35" y1="18" x2="31.5" y2="25" stroke="url(#lb-orange-grad)" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />
  <line x1="35" y1="18" x2="38.5" y2="25" stroke="url(#lb-orange-grad)" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />
  <path 
    d="M 30 25 C 30 29.5, 40 29.5, 40 25 Z" 
    fill="url(#lb-orange-grad)"
  />

  <!-- Central Tech AI Node -->
  <circle cx="24" cy="24" r="2.2" fill="#FFA347" stroke="url(#lb-orange-grad)" stroke-width="1" />

  <!-- Pedestal Base of Law -->
  <line 
    x1="19" y1="34" x2="29" y2="34" 
    stroke="url(#lb-orange-grad)" 
    stroke-width="2.2" 
    stroke-linecap="round"
  />
  <line 
    x1="16.5" y1="37" x2="31.5" y2="37" 
    stroke="url(#lb-orange-grad)" 
    stroke-width="1.5" 
    stroke-linecap="round"
    opacity="0.85"
  />
</svg>

