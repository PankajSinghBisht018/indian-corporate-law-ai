<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Brand Orange Gradient -->
    <linearGradient id="lb-fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9838" />
      <stop offset="45%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Warm Highlight Gradient -->
    <linearGradient id="lb-fav-hl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <linearGradient id="lb-fav-fill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Outer Protective Shield (Transparent Background) -->
  <path 
    d="M 24 4 C 36 4, 43 11, 43 22 C 43 34.5, 24 44, 24 44 C 24 44, 5 34.5, 5 22 C 5 11, 12 4, 24 4 Z" 
    fill="url(#lb-fav-fill)" 
    stroke="url(#lb-fav-grad)" 
    stroke-width="2.8" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Top Legal Beacon / AI Spark Diamond -->
  <polygon 
    points="24,9 27,13 24,17 21,13" 
    fill="url(#lb-fav-hl)" 
    stroke="url(#lb-fav-grad)"
    stroke-width="0.75"
  />

  <!-- Scales of Justice: Balance Crossbeam -->
  <path 
    d="M 13 18 C 17.5 16.5, 30.5 16.5, 35 18" 
    stroke="url(#lb-fav-grad)" 
    stroke-width="2.5" 
    stroke-linecap="round" 
    fill="none"
  />

  <!-- Central Column -->
  <line 
    x1="24" y1="17" x2="24" y2="34" 
    stroke="url(#lb-fav-grad)" 
    stroke-width="2.5" 
    stroke-linecap="round"
  />

  <!-- Left Scale: Strings & Pan -->
  <line x1="13" y1="18" x2="9.5" y2="25" stroke="url(#lb-fav-grad)" stroke-width="1.3" stroke-linecap="round" opacity="0.9" />
  <line x1="13" y1="18" x2="16.5" y2="25" stroke="url(#lb-fav-grad)" stroke-width="1.3" stroke-linecap="round" opacity="0.9" />
  <path 
    d="M 8 25 C 8 29.5, 18 29.5, 18 25 Z" 
    fill="url(#lb-fav-grad)"
  />

  <!-- Right Scale: Strings & Pan -->
  <line x1="35" y1="18" x2="31.5" y2="25" stroke="url(#lb-fav-grad)" stroke-width="1.3" stroke-linecap="round" opacity="0.9" />
  <line x1="35" y1="18" x2="38.5" y2="25" stroke="url(#lb-fav-grad)" stroke-width="1.3" stroke-linecap="round" opacity="0.9" />
  <path 
    d="M 30 25 C 30 29.5, 40 29.5, 40 25 Z" 
    fill="url(#lb-fav-grad)"
  />

  <!-- Central AI Node -->
  <circle cx="24" cy="24" r="2.4" fill="#FFA347" stroke="url(#lb-fav-grad)" stroke-width="1.2" />

  <!-- Pedestal -->
  <line 
    x1="19" y1="34" x2="29" y2="34" 
    stroke="url(#lb-fav-grad)" 
    stroke-width="2.5" 
    stroke-linecap="round"
  />
  <line 
    x1="16.5" y1="37" x2="31.5" y2="37" 
    stroke="url(#lb-fav-grad)" 
    stroke-width="1.8" 
    stroke-linecap="round"
  />
</svg>
